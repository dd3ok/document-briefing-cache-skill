[project]
name = "document-briefing-cache"
version = "0.4.0"
description = "Reusable document briefing skill with document-level caching and template rendering."
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1.0",
  "pydantic>=2.0.0",
  "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0"
]
pdf = [
  "pypdf>=4.0.0"
]
llm = [
  "openai>=1.0.0"
]

[project.scripts]
document-briefing-cache = "document_briefing_cache.cli:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_briefing_cache = ["templates/*.md.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
